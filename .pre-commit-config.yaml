repos:
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npx eslint --fix
        language: system
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: true

      - id: commitlint
        name: Commitlint
        entry: npx commitlint --edit
        language: system
        stages: [commit-msg]
        pass_filenames: true
